[tool.poetry]
name = "quant-dev-assignment"
version = "1.0.0"
description = "Modular quantitative trading engine prototype"
authors = ["Shorabh Singhmar"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
pydantic = "*"
httpx = "*"
websockets = "*"
python-dotenv = "*"
matplotlib = "*"
streamlit = "*"
altair = "*"
yfinance = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"